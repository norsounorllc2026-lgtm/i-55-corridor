name: Build newsroom rosters

on:
  schedule:
    # Every Monday at 09:41 UTC (about 3:41 AM Central)
    - cron: "41 9 * * 1"
  workflow_dispatch:
    inputs:
      outlets:
        description: "Only these outlet ids (space separated). Leave blank for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-roster
  cancel-in-progress: false

jobs:
  roster:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The typed-in outlet ids arrive as an environment variable (never pasted into the
      # command itself), and anything other than letters, numbers, - and _ is removed.
      - name: Find each newsroom's professionals
        env:
          OUTLETS: ${{ github.event.inputs.outlets }}
        run: |
          CLEAN=$(printf '%s' "${OUTLETS:-}" | tr -cd 'A-Za-z0-9_ -')
          # shellcheck disable=SC2086  # split on purpose: one argument per outlet id
          python scripts/build_roster.py $CLEAN

      - name: Save changes
        run: |
          git config user.name "i55-corridor-bot"
          git config user.email "i55-corridor-bot@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/roster.json
          if git diff --cached --quiet; then
            echo "No roster changes."
          else
            git commit -m "Weekly roster update"
            git push
